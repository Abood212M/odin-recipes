<h2>Description</h2>
<p>يعد الكشرى من اجمل الوجبات التى تشعرك بالشبع والإمتلاء والطعم اللاذع لليمون غنها حقا وجبة رائعة</p>

<h2>Ingredients</h2>
<ul>
<li>ارز</li>
<li>معكرونة</li>
<li>صلصة ودقة ليمون</li>
<li>سباجتى</li>
</ul>

<h2>Steps</h2>
<ol>
<li>طهى المعكرونة والأرز</li>
<li>دمجهم مع بعض</li>
<li>تقديمهم مع الصلصة والدقة</li>
</ol>
